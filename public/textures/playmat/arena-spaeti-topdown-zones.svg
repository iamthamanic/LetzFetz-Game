<?xml version="1.0" encoding="UTF-8"?>
<!--
  Playmat zone overlay for arena-spaeti (top-down).
  viewBox 1920×1080 — align background image to same aspect ratio.
  Location: public/textures/playmat/arena-spaeti-topdown-zones.svg
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="zone-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Opponent character dock (idle video) -->
  <rect data-zone="opponent-character" x="72" y="48" width="220" height="300" rx="12"
    stroke="#f87171" stroke-width="2" stroke-dasharray="10 6" fill="rgba(127,29,29,0.18)"/>
  <text x="182" y="38" text-anchor="middle" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="0.12em">GEGNER</text>

  <!-- Opponent engine (4 slots) -->
  <g data-zone="opponent-engine">
    <rect x="520" y="120" width="170" height="230" rx="8" stroke="#fbbf24" stroke-width="2" fill="rgba(251,191,36,0.08)"/>
    <rect x="710" y="120" width="170" height="230" rx="8" stroke="#fbbf24" stroke-width="2" fill="rgba(251,191,36,0.08)"/>
    <rect x="1040" y="120" width="170" height="230" rx="8" stroke="#fbbf24" stroke-width="2" fill="rgba(251,191,36,0.08)"/>
    <rect x="1230" y="120" width="170" height="230" rx="8" stroke="#fbbf24" stroke-width="2" fill="rgba(251,191,36,0.08)"/>
    <text x="960" y="108" text-anchor="middle" fill="#fde68a" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="0.08em">GEGNER-ENGINE</text>
  </g>

  <!-- Shared draw pile -->
  <rect data-zone="deck" x="48" y="420" width="120" height="168" rx="8"
    stroke="#a78bfa" stroke-width="2" fill="rgba(167,139,250,0.12)"/>
  <text x="108" y="408" text-anchor="middle" fill="#c4b5fd" font-family="system-ui,sans-serif" font-size="12" font-weight="600">NACHZIEH</text>

  <!-- Shared discard -->
  <rect data-zone="discard" x="1752" y="420" width="120" height="168" rx="8"
    stroke="#94a3b8" stroke-width="2" fill="rgba(148,163,184,0.12)"/>
  <text x="1812" y="408" text-anchor="middle" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12" font-weight="600">ABLAGE</text>

  <!-- Combat / clash ring (Späti intersection) -->
  <ellipse data-zone="combat" cx="960" cy="520" rx="200" ry="140"
    stroke="url(#zone-glow)" stroke-width="4" fill="rgba(251,191,36,0.1)" filter="url(#soft-glow)"/>
  <text x="960" y="528" text-anchor="middle" fill="#fef3c7" font-family="system-ui,sans-serif" font-size="16" font-weight="700" letter-spacing="0.1em">KAMPF</text>

  <!-- Player engine (4 slots) -->
  <g data-zone="player-engine">
    <rect x="520" y="620" width="170" height="230" rx="8" stroke="#34d399" stroke-width="2" fill="rgba(52,211,153,0.08)"/>
    <rect x="710" y="620" width="170" height="230" rx="8" stroke="#34d399" stroke-width="2" fill="rgba(52,211,153,0.08)"/>
    <rect x="1040" y="620" width="170" height="230" rx="8" stroke="#34d399" stroke-width="2" fill="rgba(52,211,153,0.08)"/>
    <rect x="1230" y="620" width="170" height="230" rx="8" stroke="#34d399" stroke-width="2" fill="rgba(52,211,153,0.08)"/>
    <text x="960" y="608" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="14" font-weight="600" letter-spacing="0.08em">DEINE ENGINE</text>
  </g>

  <!-- Player character dock -->
  <rect data-zone="player-character" x="72" y="720" width="220" height="300" rx="12"
    stroke="#34d399" stroke-width="2" stroke-dasharray="10 6" fill="rgba(6,78,59,0.22)"/>
  <text x="182" y="710" text-anchor="middle" fill="#6ee7b7" font-family="system-ui,sans-serif" font-size="18" font-weight="700" letter-spacing="0.12em">DU</text>

  <!-- Hand arc -->
  <path data-zone="player-hand" d="M 280 980 Q 960 860 1640 980 L 1640 1060 L 280 1060 Z"
    stroke="#a855f7" stroke-width="2" fill="rgba(168,85,247,0.1)"/>
  <text x="960" y="1010" text-anchor="middle" fill="#e9d5ff" font-family="system-ui,sans-serif" font-size="16" font-weight="600" letter-spacing="0.1em">HAND</text>
</svg>
