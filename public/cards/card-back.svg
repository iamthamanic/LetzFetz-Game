<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="lf-back-bg" x1="0" y1="0" x2="200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a1410"/>
      <stop offset="50%" stop-color="#120e0b"/>
      <stop offset="100%" stop-color="#1f1812"/>
    </linearGradient>
    <linearGradient id="lf-back-panel" x1="100" y1="40" x2="100" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e2d9cc"/>
      <stop offset="45%" stop-color="#d9d1c1"/>
      <stop offset="100%" stop-color="#a89888"/>
    </linearGradient>
    <pattern id="lf-back-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <path d="M0 8 L8 0" stroke="#5a0705" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="lf-back-grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="noise" mode="multiply"/>
    </filter>
  </defs>

  <!-- Outer frame -->
  <rect width="200" height="300" fill="url(#lf-back-bg)"/>
  <rect x="6" y="6" width="188" height="288" rx="2" stroke="#701010" stroke-width="2" fill="none" opacity="0.85"/>
  <rect x="10" y="10" width="180" height="280" rx="1" stroke="#f2e8dc" stroke-width="0.75" fill="none" opacity="0.25"/>

  <!-- Parchment panel -->
  <rect x="18" y="22" width="164" height="256" rx="2" fill="url(#lf-back-panel)" filter="url(#lf-back-grain)"/>
  <rect x="18" y="22" width="164" height="256" rx="2" fill="url(#lf-back-hatch)"/>

  <!-- Corner ornaments -->
  <path d="M24 28 L44 28 L44 32 L28 32 L28 44 L24 44 Z" fill="#701010" opacity="0.9"/>
  <path d="M176 28 L156 28 L156 32 L172 32 L172 44 L176 44 Z" fill="#701010" opacity="0.9"/>
  <path d="M24 272 L44 272 L44 268 L28 268 L28 256 L24 256 Z" fill="#701010" opacity="0.9"/>
  <path d="M176 272 L156 272 L156 268 L172 268 L172 256 L176 256 Z" fill="#701010" opacity="0.9"/>

  <!-- Center emblem ring -->
  <circle cx="100" cy="138" r="52" stroke="#5a0705" stroke-width="2.5" fill="#1f1812" fill-opacity="0.35"/>
  <circle cx="100" cy="138" r="44" stroke="#701010" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Wordmark -->
  <text x="100" y="128" text-anchor="middle" fill="#5a0705" font-family="Impact, Haettenschweiler, sans-serif" font-size="22" font-weight="700" letter-spacing="0.14em">LETZ</text>
  <text x="100" y="156" text-anchor="middle" fill="#701010" font-family="Impact, Haettenschweiler, sans-serif" font-size="26" font-weight="700" letter-spacing="0.18em">FETZ</text>

  <!-- Bottom tag -->
  <text x="100" y="248" text-anchor="middle" fill="#5a0705" font-family="system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="0.22em" opacity="0.85">VERDECKT</text>
</svg>
